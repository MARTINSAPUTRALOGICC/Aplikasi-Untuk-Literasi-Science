<aside class="left-sidebar" data-sidebarbg="skin5">
    <div class="scroll-sidebar">
        {% include "dashboard/sidebar.html" %}
    </div>
</aside>

<div class="page-wrapper">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-15">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ cardtitle }}</h5>

                        <form id="assignForm" class="card p-4 shadow-sm">
                            <!-- Website -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Pilih Website</label>
                                <select class="form-select" id="websiteSelect" name="website" required>
                                    <option value="">-- Pilih Website --</option>
                                    {% for name, value in websites %}
                                        <option value="{{ value }}">{{ name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- User -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Pilih User</label>
                                <select class="form-select user-select" id="userSelect" name="user" required>
                                    <option value="">-- Pilih User --</option>
                                    {% for u in users %}
                                        <option value="{{ u.id }}">{{ u.name }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Checklist Pages -->
                            <div class="mb-3">
                                <label class="form-label fw-bold">Checklist Halaman</label>
                                <div class="row">
                                    <div class="col-md-6">
                                        {% for i in range(1,5) %}
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="pages[]" value="page{{i}}" id="page{{i}}">
                                            <label class="form-check-label" for="page{{i}}">Page {{i}}</label>
                                        </div>
                                        {% endfor %}
                                    </div>
                                    <div class="col-md-6">
                                        {% for i in range(5,8) %}
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="pages[]" value="page{{i}}" id="page{{i}}">
                                            <label class="form-check-label" for="page{{i}}">Page {{i}}</label>
                                        </div>
                                        {% endfor %}
                                    </div>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success w-100">💾 Simpan Assignment</button>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
