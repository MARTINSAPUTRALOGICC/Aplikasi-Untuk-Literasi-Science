<aside class="left-sidebar" data-sidebarbg="skin5">
    <div class="scroll-sidebar">
        {% include "dashboard/sidebar.html" %}
    </div>
</aside>

<div class="page-wrapper">
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-15">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">{{ cardtitle }}</h5>
<form id="assignFormCrud" class="card p-4 shadow-sm">
    <!-- Website -->
    <div class="mb-3">
        <label class="form-label fw-bold">Pilih Website</label>
        <select class="form-select" id="websiteSelectCrud" name="website" required>
            <option value="">-- Pilih Website --</option>
            {% for name, value in websites %}
                <option value="{{ value }}">{{ name }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- User -->
    <div class="mb-3">
        <label class="form-label fw-bold">Pilih User</label>
        <select class="form-select user-select" id="userSelectCrud" name="user" required>
            <option value="">-- Pilih User --</option>
            {% for u in users %}
                <option value="{{ u.id }}">{{ u.name }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Checklist CRUD -->
    <div class="mb-3">
        <label class="form-label fw-bold">Checklist Hak Akses</label>
        <div class="row">
            <div class="col-md-6">
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="settings[]" value="create" id="create">
                    <label class="form-check-label" for="create">Create</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="settings[]" value="update" id="update">
                    <label class="form-check-label" for="update">Update</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="settings[]" value="delete" id="delete">
                    <label class="form-check-label" for="delete">Delete</label>
                </div>
                <div class="form-check">
                    <input class="form-check-input" type="checkbox" name="settings[]" value="table" id="table">
                    <label class="form-check-label" for="table">Table</label>
                </div>
            </div>
        </div>
    </div>

    <button type="submit" class="btn btn-success w-100">💾 Simpan CRUD</button>
</form>


                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
