  <style>
   .power-text {
    font-size: 20px; /* Adjust the font size as needed for superscript */
    vertical-align: super; /* Align the text as superscript */
}

/* Styling link PDF */
a.pdf-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 4px 8px;
  background-color: #e53935; /* merah */
  color: white;
  font-weight: 600;
  border-radius: 4px;
  text-decoration: none;
  font-size: 0.9rem;
  transition: background-color 0.3s ease;
}

a.pdf-link:hover {
  background-color: #b71c1c;
  text-decoration: underline;
  cursor: pointer;
}

/* Icon PDF (bisa pake font-awesome atau svg) */
a.pdf-link svg {
  width: 16px;
  height: 16px;
  fill: white;
}

.switch {
  position: relative;
  display: inline-block;
  width: 80px;  /* panjang kapsul */
  height: 34px; /* tinggi kapsul */
}

.switch input {
  opacity: 0;
  width: 0;
  height: 0;
}

.slider {
  position: absolute;
  cursor: pointer;
  inset: 0;
  background-color: #ccc;
  transition: .4s;
  border-radius: 34px; /* setengah dari tinggi = kapsul */
}

.slider:before {
  position: absolute;
  content: "";
  height: 26px;
  width: 26px;
  left: 4px;
  bottom: 4px;
  background-color: white;
  transition: .4s;
  border-radius: 50%; /* bulat untuk knop */
}

input:checked + .slider {
  background-color: #4CAF50;
}

input:checked + .slider:before {
  transform: translateX(46px); /* geser knop sesuai panjang kapsul */
}


.page-wrapper,
.container-fluid {
  z-index: auto !important;
}

/* Hardcode ukuran tombol Edit dan Delete */
.btn-warning.btn-xs, .btn-danger.btn-xs {
    height: 35px !important;      /* tinggi tombol */
    min-width: 80px !important;   /* lebar minimal tombol */
    padding: 6px 12px !important; /* padding dalam tombol */
    font-size: 14px !important;   /* ukuran font */
    border-radius: 4px;           /* sudut agak membulat */
    display: inline-block;
    text-align: center;
    vertical-align: middle;
    line-height: 22px;            /* supaya teks center vertikal */
    cursor: pointer;
}
